server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript text/markdown;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    # repetir cabeceras de seguridad (add_header en location anula las del server)
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }
  location / { try_files $uri /index.html; }
}
